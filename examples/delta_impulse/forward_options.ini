[forward-user]
     example = 1

     # initial_condition
     # 0 : q = 0
     # 1 : Gaussian hump
     # 2 : Disk (using cellave2)
     initial-condition = 2

     # Weight for initial forcing
     W_f   = 1

     # Weight for initial condition
     W_i = 1

     # beta: width of the Gaussian initial condition
     beta = 0.5

     # x0: x-coordinate of the center of the Gaussian
     x0 = 0.25

     # y0: y-coordinate of the center of the Gaussian
     y0 = 1
    

[forward-clawpatch]
     # Grid dimensions
     mx = 32              # mx_leaf
     my = 32             # my_leaf
     mbc = 2              # Number of ghost cells
     maux = 3   # 2 velocities and adjoint solution here

     # Clawpatch tagging criteria
     # value       : value exceeds threshold
     # minmax      : qmax-qmin exceeds threshold
     # difference  : difference (e.g. dqx = q(i+1,j)-q(i-1,j)) exceeds threshold
     # gradient    : gradient exceeds threshold
     # user        : User defined criteria
     refinement-criteria = minmax

     # Equations and boundary conditions
     meqn = 1             # Number of equations

[Options]
     # Core option
     verbosity=production

[forward]
     run-directory = "forward"
     logging-prefix = "forward"
     # ---------------------------
     # Dynamic gridding parameters     
     # ---------------------------

     minlevel = 2         # Minimum level  (was 4: uniform, showed no AMR)
     maxlevel = 4         # Maximum levels of refinement  (was 4)

     regrid_interval = 1  # Regrid every 'regrid_interval' time steps.
     smooth-level = 4
     refine_threshold = 0.125
     coarsen_threshold = 0.06
     smooth-refine = T
     #refine-level = 5

     # --------------
     # Time stepping
     # --------------
     tfinal = 2.0        #  Final time

     use_fixed_dt = F     # Take a fixed time step
     initial_dt = 0.005   # Initial time step for 'minlevel'
     max_cfl = 1.0        # maximum cfl
     desired_cfl = 0.9    # desired cfl

     outstyle = 1         # OutputStyle = 1,2,3

     nout = 20            # Used for all three out styles;  has different meaning, though.
     nstep = 1            # Only used if outstyle is 3

     subcycle = F         # subcycle in time ( = T or F).

     # -------------------
     # File and console IO
     # -------------------
     output = T
     checkpoint = F
     restart = T
     restart-file = "restart"                       
     partition-file = "Partition"

     output-gauges=T
     moving-gauges=F
     moving-gauges-local=F
     gauge-buffer-length=1000


     # -----------
     # Tikz output 
     # -----------
     tikz-out = F
     tikz-figsize = 4 4 
     tikz-plot-prefix = 'plot'
     tikz-plot-suffix = 'png'

     # -------------------------
     # Diagnostics and debugging
     # -------------------------
     trapfpe = T                 # Trap floating point errors.
     mpi_debug = F               # Attach mpi processes in gdb
     conservation-check = F
     run-user-diagnostics = F
     compute-error = F
     report-timing=T
     report-timing-verbosity=wall

     # Unused
     #verbosity=production



     # -------
     # Mapping
     # -------
     manifold = F         # Manifold

     mi = 1
     mj = 1

     # Shift Cartesian map in [-1,1]x[-1,1] to [0,2]x[0,2]
     shift = 0 0 0

     # Domain dimensions - used only if manifold = F
     ax = 0
     bx = 2
     ay = 0
     by = 2

     periodic_x = True
     periodic_y = True


[forward-clawpack46]
     order  = 2 2         # normal and transverse order
     mcapa = 0            # mcapa
     src_term = 1         # src_term
     use-fwaves = 1      # fwaves

     mwaves = 1           # mwaves
     mthlim = 4           # mthlim (is a vector in general, with 'mwaves' entries)
     mthbc = 1 1 1 1      # mthbc (=left,right,bottom,top)

     # output
     ascii-out = T
     vtk-out = F
