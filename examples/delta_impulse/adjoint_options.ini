[adjoint-user]
example = 1
mdata = 1                 # single impulse (was 3)
initial-condition = 0
pseudo-1d = 2
epsilon-1d = 4e-3
epsilon-2d = 1e-2 #1e-4 and 1e-3 fall through the mesh
beta = 0.5
x0 = 0.5
y0 = 1
xm = 1.5                  # east of the rotation centre (1,1), r = 0.5
ym = 1.0
tm = 1.5                  
dm = 8.0                  # only sets beta; alpha_m and r_m do not depend on it
w_eps = 100
split-comm = F

[adjoint-clawpatch]
mx = 32               # mx_leaf
my = 32              # my_leaf
mbc = 2              # Number of ghost cells
maux = 2
refinement-criteria = gradient
meqn = 1             # Number of equations

[adjoint]
run-directory = "adjoint"
logging-prefix = "adjoint"
minlevel = 2         # Minimum level  (was 5: uniform, showed no AMR)
maxlevel = 5         # Maximum levels of refinement
regrid_interval = 1  # Regrid every 'regrid_interval' time steps.
smooth-refine = T
smooth-level = 4
refine_threshold = 0.125
coarsen_threshold = 0.06
tfinal = 2.0          #  Final time
use_fixed_dt = F      # Take a fixed time step
initial_dt = 0.005    # Initial time step for 'minlevel'
max_cfl = 1.0         # maximum cfl
desired_cfl = 0.9     # desired cfl
outstyle = 1          # Controls how often output files are produced
nout = 20
nstep = 1             # Only used if outstyle is 3
subcycle = F          # subcycle in time ( = T or F).
conservation-check = F
run-user-diagnostics = F
trapfpe = F          # trap floating point exceptions
mpi_debug = F
report-timing = T
report-timing-verbosity = wall
verbosity = production
output = T
output-gauges = F
moving-gauges = F
moving-gauges-local = F
gauge-buffer-length = 100
checkpoint = T
restart = F
restart-file = "restart"
partition-file = "partition"
tikz-out = F
tikz-figsize = 4 4     # Only used to compute DPI
tikz-plot-prefix = 'plot'
tikz-plot-suffix = 'png'
manifold = F
ax = 0
bx = 2
ay = 0
by = 2
mi = 1
mj = 1
periodic_x = True
periodic_y = True

[adjoint-clawpack46]
order = 2 2         # normal and transverse order
mcapa = 0            # mcapa
src_term = 1         # src_term
use-fwaves = 0      # fwaves
mwaves = 1           # mwaves
mthlim = 4           # mthlim (is a vector in general, with 'mwaves' entries)
mthbc = 1 1 1 1      # mthbc(1) (left edge), etc.
ascii-out = T
vtk-out = F

