[user]
     # 0 : smooth initial condition
     # 1 : discontinuous initial condition
     # 2 : smooth (tanh) solution
     # 3 : constant initial condition
    
     example = 3
     

     # Refinement strategy
     # 0 qmax > tau (for smooth solutions)
     # 1 Usual refinement : qmax-qmin > tau (discontinuous solution)
     # 2 tau < q < 1-tau 
     # Use gradients
     refinement-strategy = 3

     # Velocity field
     ubar = 0.75
     vbar = -0.75    

     claw-version = 4

[clawpatch]
     # Grid dimensions
     mx = 16 	           # mx_leaf
     my = 16             # my_leaf
     mbc = 2              # Number of ghost cells
     maux = 5

     # Equations and boundary conditions
     meqn = 1             # Number of equations

[Options]
     # ---------------------------
     # Dynamic gridding parameters     
     # ---------------------------

     minlevel = 1         # Minimum level
     maxlevel = 5         # Maximum levels of refinement

     regrid_interval = 1  # Regrid every 'regrid_interval' time steps.
     refine_threshold = 10.    # 10 / 7
     coarsen_threshold = 3.

     smooth-refine = T
     smooth-level = 6

     # --------------
     # Time stepping
     # --------------

     tfinal = 0.6         #  Final time

     use_fixed_dt = F     # Take a fixed time step
     initial_dt = 0.03  # Initial time step for 'minlevel'
     max_cfl = 0.6        # maximum cfl
     desired_cfl = 0.5    # desired cfl

     outstyle = 1         # OutputStyle = 1,2,3

     nout = 12             # Used for all three out styles;  has different meaning, though.
     nstep = 1             # Only used if outstyle is 3

     subcycle = F          # subcycle in time ( = T or F).
     advance-one-step = F        
     outstyle-uses-maxlevel = F  

     time-sync = F

     flux-correction = T
     fluctuation-correction = T

     compute-error = F
     conservation-check = T


     # -------------------
     # File and console IO
     # -------------------
     verbosity = production  
     output = T

     # -----------
     # Tikz output 
     # -----------
     tikz-out = T
     tikz-figsize = 4 4 
     tikz-plot-prefix = 'plot'
     tikz-plot-suffix = 'png'

     # -------------------------
     # Diagnostics and debugging
     # -------------------------
     trapfpe = T                 # Trap floating point errors.
     mpi_debug = F               # Attach mpi processes in gdb
     run-user-diagnostics = F
     report-timing = T
     report-timing-verbosity = wall      

     # When running in parallel, set to T
     # This is not quite working yet.
     ghost_patch_pack_extra = F
     ghost_patch_pack_numextrafields = 5

     # -------
     # Mapping
     # -------
     manifold = F         # Manifold
     periodic_x = T
     periodic_y = T

     # Domain dimensions - used only if manifold = F
     ax = 0
     bx = 1
     ay = 0
     by = 1


[activeflux]   
     order  = 2 2         # normal and transverse order
     mcapa = 0            # mcapa
     src_term = 0         # src_term
     use-fwaves = F

     mwaves = 1           # mwaves
     mthlim = 0           # mthlim (is a vector in general, with 'mwaves' entries)
     mthbc = 0 0 0 0      # mthbc (=left,right,bottom,top)

     # output
     ascii-out = T
     vtk-out = F
